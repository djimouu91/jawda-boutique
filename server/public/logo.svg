<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <style>
      .brand { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sub   { font-family: 'Jost', 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- Decorative geometric diamond (Islamic-inspired) -->
  <g transform="translate(28, 60)">
    <!-- Outer diamond -->
    <polygon points="0,-28 16,-12 28,0 16,12 0,28 -16,12 -28,0 -16,-12"
             fill="none" stroke="#7a5c44" stroke-width="1.2" opacity="0.6"/>
    <!-- Inner diamond rotated 45° -->
    <polygon points="0,-18 13,0 0,18 -13,0"
             fill="none" stroke="#3b2314" stroke-width="1.5"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3.5" fill="#3b2314"/>
    <!-- Corner accents -->
    <line x1="0" y1="-28" x2="0" y2="-22" stroke="#7a5c44" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="22"  x2="0" y2="28"  stroke="#7a5c44" stroke-width="1" opacity="0.5"/>
    <line x1="-28" y1="0" x2="-22" y2="0" stroke="#7a5c44" stroke-width="1" opacity="0.5"/>
    <line x1="22"  y1="0" x2="28"  y2="0" stroke="#7a5c44" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- JAWDA wordmark -->
  <text x="72" y="68"
        class="brand"
        font-size="42"
        font-weight="400"
        letter-spacing="10"
        fill="#3b2314">JAWDA</text>

  <!-- Thin divider line -->
  <line x1="72" y1="80" x2="306" y2="80" stroke="#7a5c44" stroke-width="0.8" opacity="0.5"/>

  <!-- Tagline -->
  <text x="72" y="95"
        class="sub"
        font-size="9"
        font-weight="400"
        letter-spacing="4"
        fill="#8a7060">CLOTHING &amp; HOME · CANADA</text>
</svg>
